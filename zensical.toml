[project]
site_name = "BrandSTL"
site_description = "Carve text into STL 3D models using Blender's boolean operations"
docs_dir = "docs"
site_dir = "site"
copyright = 'Docs made with <a href="https://zensical.org">Zensical</a> · BrandSTL developed by ToledoEM · MIT License'
repo_url = "https://github.com/ToledoEM/brandstl"
repo_name = "ToledoEM/brandstl"

nav = [
  { "Home" = "index.md" },
]

[project.extra]
generator = false

[project.theme]
language = "en"
custom_dir = "overrides"
icon.repo = "fontawesome/brands/github"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
